name: Build and deploy academic site

on:
  push:
    branches: [main, codex/al-folio-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm ci
      - name: Check formatting and starter boundaries
        run: |
          npm run lint:prettier
          npm run lint:style-contract
      - name: Audit migration and acknowledged overrides
        run: |
          bundle exec al-folio upgrade audit --no-fail
          bundle exec al-folio upgrade overrides audit
      - name: Build project site and check routes
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build
          python bin/check_site.py _site /peterzianwang.github.io
      - name: Upload reviewable build
        uses: actions/upload-artifact@v4
        with:
          name: academic-site-preview
          path: _site
      - name: Check root homepage configuration
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --config _config.yml,_config.root.yml --destination _site_root
          python bin/check_site.py _site_root ""
      - name: Upload root homepage preview
        uses: actions/upload-artifact@v4
        with:
          name: root-homepage-preview
          path: _site_root
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
